name: Update news

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-news:
    if: >
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'ci/news-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Save PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt

      - name: Update news
        run: |
          python3 scripts/news.py \
            "${{ github.event.pull_request.user.login }}" \
            /tmp/pr_body.txt

      - name: Check for changes
        id: changes
        run: |
          git add jsons/news.json jsons/news_content.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create news branch
        if: steps.changes.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BRANCH="ci/news-${PR_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git commit -m "update news for #${PR_NUMBER}"
          git push origin "$BRANCH"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr create \
            --base master \
            --head "ci/news-${PR_NUMBER}" \
            --title "Update news for #${PR_NUMBER}" \
            --body "Generated changelog update for #${PR_NUMBER}: ${PR_TITLE}"
